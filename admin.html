<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Golden Crow TV</title>
  <style>
    body { background-color: #0d0f12; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
    .container { max-width: 750px; margin: auto; background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { color: #ff4500; text-align: center; margin-bottom: 20px; }
    h3 { color: #e65c00; border-bottom: 1px solid #30363d; padding-bottom: 5px; margin-top: 0; }
    label { font-size: 13px; color: #8b949e; display: block; margin-top: 12px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #0d0f12; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; background: #ff4500; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; margin-top: 18px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #e03e00; }
    .btn-clan { background: #8a2be2; }
    .btn-clan:hover { background: #7b1fa2; }
    .btn-sponsor { background: #d4af37; color: #000; }
    .btn-sponsor:hover { background: #c59b27; }
    .btn-edit { background: #1f6feb; }
    .btn-edit:hover { background: #388bfd; }
    .section { border-top: 1px solid #30363d; margin-top: 25px; padding-top: 20px; }
    .status { margin-top: 15px; font-size: 14px; text-align: center; font-weight: bold; padding: 10px; border-radius: 6px; }
    .success { background: rgba(0, 255, 136, 0.1); color: #00ff88; border: 1px solid #00ff88; }
    .warning { background: rgba(255, 165, 0, 0.1); color: #ffaa00; border: 1px solid #ffaa00; }
    .error { background: rgba(255, 77, 77, 0.1); color: #ff4d4d; border: 1px solid #ff4d4d; }
  </style>
</head>
<body>

<div class="container">
  <h2>PANEL ADMIN ॐ GOLDEN CROW TV</h2>

  <label>Token de Acceso de GitHub (Personal Access Token):</label>
  <input type="password" id="githubToken" placeholder="Pega tu token ghp_... aquí" onchange="cargarDatosAdmin()">

  <!-- 1. CREAR NUEVO HUB -->
  <div class="section">
    <h3>📂 1. Crear Nuevo Hub (Serie / Anime / Película / Novela)</h3>
    <label>ID Único del Hub (sin espacios, ej: dragon-ball-z):</label>
    <input type="text" id="hubId" placeholder="dragon-ball-z">
    <label>Título del Hub:</label>
    <input type="text" id="hubTitle" placeholder="Dragon Ball Z">
    <label>Categoría:</label>
    <select id="hubCategory">
      <option value="anime">Anime</option>
      <option value="series">Series</option>
      <option value="peliculas">Películas</option>
      <option value="telenovelas">Telenovelas</option>
    </select>
    <label>URL de Portada Principal (Fondo general):</label>
    <input type="text" id="hubPoster" placeholder="https://...">
    <label>Sinopsis General:</label>
    <textarea id="hubSynopsis" rows="3" placeholder="Sinopsis..."></textarea>
    <button onclick="procesarHub()">🚀 Guardar Hub Principal</button>
  </div>

  <!-- 2. AGREGAR CAPÍTULO -->
  <div class="section">
    <h3>🎬 2. Agregar Capítulo / Temporada a un Hub</h3>
    <label>ID del Hub:</label>
    <input type="text" id="capHubId" placeholder="dragon-ball-z">
    <label>Número de Temporada:</label>
    <input type="number" id="capSeasonNum" value="1">
    <label>URL Imagen/Fondo de la Temporada:</label>
    <input type="text" id="capSeasonImage" placeholder="https://...">
    <label>Número de Capítulo:</label>
    <input type="number" id="capNum" value="1">
    <label>Título del Capítulo:</label>
    <input type="text" id="capTitle" placeholder="Ej. El misterioso guerrero Saiyajin">
    <label>Enlace de Video (Iframe o MP4/M3U8):</label>
    <input type="text" id="capVideoUrl" placeholder="<iframe ...></iframe>">
    <label>Sinopsis del Capítulo (Opcional):</label>
    <textarea id="capSynopsis" rows="2" placeholder="Detalles..."></textarea>
    <button onclick="procesarCapitulo()">➕ Guardar Capítulo</button>
  </div>

  <!-- 3. EDITAR O CORREGIR CONTENIDO SUBIDO -->
  <div class="section">
    <h3>✏️ 3. Editar o Corregir Contenido Subido</h3>
    <label>Selecciona el Hub a Editar:</label>
    <select id="editHubSelect" onchange="seleccionarHubParaEditar()">
      <option value="">-- Primero ingresa tu Token y carga los Hubs --</option>
    </select>

    <label>ID del Hub (No editable):</label>
    <input type="text" id="editHubId" disabled style="background: #21262d;">

    <label>Nuevo Título del Hub:</label>
    <input type="text" id="editHubTitle">

    <label>Nueva URL Portada / Fondo General:</label>
    <input type="text" id="editHubPoster">

    <label>Nueva Sinopsis General:</label>
    <textarea id="editHubSynopsis" rows="2"></textarea>

    <div style="background: #0d0f12; padding: 10px; border-radius: 6px; margin-top: 10px; border: 1px solid #30363d;">
      <label style="color: #ff4500;">Modificar Capítulo Específico (Opcional):</label>
      <div style="display: flex; gap: 10px;">
        <div style="flex: 1;"><label>Temporada:</label><input type="number" id="editSeasonNum" value="1"></div>
        <div style="flex: 1;"><label>Capítulo:</label><input type="number" id="editCapNum" value="1"></div>
      </div>
      <label>Nuevo Título de Capítulo:</label>
      <input type="text" id="editCapTitle" placeholder="Dejar en blanco si no se edita capítulo">
      <label>Nuevo Enlace de Video / Iframe:</label>
      <input type="text" id="editCapVideo" placeholder="<iframe ...></iframe>">
      <label>Nueva Imagen de Temporada (Banner):</label>
      <input type="text" id="editSeasonImage" placeholder="https://...">
    </div>

    <button class="btn-edit" onclick="aplicarEdicion()">💾 Actualizar y Guardar Cambios</button>
  </div>

  <!-- 4. CUADRO DE HONOR Y PATROCINADORES -->
  <div class="section">
    <h3>⭐ 4. Cuadro de Honor y Banners de Publicidad</h3>
    <label>Tipo de Registro:</label>
    <select id="pubType">
      <option value="sponsor">Patrocinador (Cuadro de Honor)</option>
      <option value="banner">Banner de Publicidad General</option>
    </select>
    <label>Nombre / Identificador:</label>
    <input type="text" id="pubName" placeholder="Ej. ॐiluminati Patrocinio">
    <label>URL del Logo o Banner (Imagen):</label>
    <input type="text" id="pubImage" placeholder="https://...">
    <label>Enlace de Destino (Opcional):</label>
    <input type="text" id="pubLink" placeholder="https://t.me/...">
    <button class="btn-sponsor" onclick="procesarPublicidad()">✨ Registrar Patrocinador / Banner</button>
  </div>

  <!-- 5. GESTIÓN DEL CLAN CODM -->
  <div class="section">
    <h3>🛡️ 5. Sección Clan CODM (ॐiluminati)</h3>
    <label>Título o Mensaje de Reclutamiento:</label>
    <input type="text" id="clanTitle" placeholder="Reclutamiento Activo - Clan ॐiluminati">
    <label>Descripción / Requisitos:</label>
    <textarea id="clanDesc" rows="2" placeholder="Jugadores activos..."></textarea>
    <label>Enlace del Botón del Clan (Telegram / WhatsApp):</label>
    <input type="text" id="clanLink" placeholder="https://t.me/...">
    <button class="btn-clan" onclick="procesarClan()">🎮 Actualizar Sección del Clan</button>
  </div>

  <div id="statusMsg"></div>
</div>

<script>
  const REPO_OWNER = "quimeracrow18";
  const REPO_NAME = "goldencrowtv";
  const FILE_PATH = "catalogo.json";
  let catalogoGlobal = { hubs: [], sponsors: [], banners: [], clan: {} };

  function showStatus(text, type = "success") {
    const el = document.getElementById('statusMsg');
    el.innerText = text;
    el.className = `status ${type}`;
  }

  async function obtenerCatalogo(token) {
    try {
      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
      });
      if (!res.ok) return { data: { hubs: [], sponsors: [], banners: [], clan: {} }, sha: null };
      const json = await res.json();
      const content = JSON.parse(decodeURIComponent(escape(window.atob(json.content.replace(/\s/g, '')))));
      if (Array.isArray(content)) {
        return { data: { hubs: content, sponsors: [], banners: [], clan: {} }, sha: json.sha };
      }
      return { data: content, sha: json.sha };
    } catch (e) {
      return { data: { hubs: [], sponsors: [], banners: [], clan: {} }, sha: null };
    }
  }

  async function guardarCatalogo(token, data, sha, mensaje) {
    const contentEncoded = btoa(unescape(encodeURIComponent(JSON.stringify(data, null, 2))));
    const body = { message: mensaje, content: contentEncoded, sha: sha };
    const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${FILE_PATH}`, {
      method: 'PUT',
      headers: { 'Authorization': `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    return res.ok;
  }

  async function cargarDatosAdmin() {
    const token = document.getElementById('githubToken').value.trim();
    if (!token) return;
    showStatus("Cargando catálogo desde GitHub...", "warning");
    let { data } = await obtenerCatalogo(token);
    catalogoGlobal = data;
    
    const select = document.getElementById('editHubSelect');
    select.innerHTML = '<option value="">-- Selecciona un Hub para editar --</option>';
    if (catalogoGlobal.hubs) {
      catalogoGlobal.hubs.forEach(h => {
        let opt = document.createElement('option');
        opt.value = h.id;
        opt.innerText = `${h.title} (${h.category})`;
        select.appendChild(opt);
      });
    }
    showStatus("¡Datos y Hubs cargados con éxito!", "success");
  }

  function seleccionarHubParaEditar() {
    const id = document.getElementById('editHubSelect').value;
    if (!id) return;
    const hub = catalogoGlobal.hubs.find(h => h.id === id);
    if (!hub) return;

    document.getElementById('editHubId').value = hub.id;
    document.getElementById('editHubTitle').value = hub.title || '';
    document.getElementById('editHubPoster').value = hub.poster || '';
    document.getElementById('editHubSynopsis').value = hub.synopsis || '';
  }

  async function procesarHub() {
    const token = document.getElementById('githubToken').value.trim();
    if (!token) { alert('Introduce tu token de GitHub.'); return; }

    const id = document.getElementById('hubId').value.trim();
    const title = document.getElementById('hubTitle').value.trim();
    const category = document.getElementById('hubCategory').value;
    const poster = document.getElementById('hubPoster').value.trim();
    const synopsis = document.getElementById('hubSynopsis').value.trim();

    if (!id || !title) { alert('El ID y el Título son obligatorios.'); return; }

    let { data, sha } = await obtenerCatalogo(token);
    if (!data.hubs) data.hubs = [];

    let hubExistente = data.hubs.find(h => h.id === id);
    if (hubExistente) {
      if (!confirm(`El Hub "${title}" ya existe. ¿Deseas actualizarlo?`)) return;
      hubExistente.title = title; hubExistente.category = category; hubExistente.poster = poster; hubExistente.synopsis = synopsis;
    } else {
      data.hubs.push({ id, title, category, poster, synopsis, seasons: [] });
    }

    if (await guardarCatalogo(token, data, sha, `Hub: ${title}`)) {
      showStatus(`¡Éxito! Hub "${title}" guardado.`, "success");
      document.getElementById('hubId').value = '';
      document.getElementById('hubTitle').value = '';
      document.getElementById('hubPoster').value = '';
      document.getElementById('hubSynopsis').value = '';
      cargarDatosAdmin();
    } else { showStatus("Error al guardar en GitHub.", "error"); }
  }

  async function procesarCapitulo() {
    const token = document.getElementById('githubToken').value.trim();
    if (!token) { alert('Introduce tu token de GitHub.'); return; }

    const hubId = document.getElementById('capHubId').value.trim();
    const seasonNum = parseInt(document.getElementById('capSeasonNum').value);
    const seasonImage = document.getElementById('capSeasonImage').value.trim();
    const capNum = parseInt(document.getElementById('capNum').value);
    const capTitle = document.getElementById('capTitle').value.trim();
    const videoUrl = document.getElementById('capVideoUrl').value.trim();
    const synopsis = document.getElementById('capSynopsis').value.trim();

    if (!hubId || !capTitle || !videoUrl) { alert('Faltan campos obligatorios.'); return; }

    let { data, sha } = await obtenerCatalogo(token);
    if (!data.hubs) data.hubs = [];

    let hub = data.hubs.find(h => h.id === hubId);
    if (!hub) { alert(`No existe el Hub "${hubId}". Créalo primero.`); return; }

    if (!hub.seasons) hub.seasons = [];
    let temporada = hub.seasons.find(s => s.season === seasonNum);
    if (!temporada) {
      temporada = { season: seasonNum, image: seasonImage, episodes: [] };
      hub.seasons.push(temporada);
    } else if (seasonImage) { temporada.image = seasonImage; }

    let episodio = temporada.episodes.find(e => e.episode === capNum);
    if (episodio) {
      if (!confirm(`El episodio ${capNum} ya existe. ¿Actualizarlo?`)) return;
      episodio.title = capTitle; episodio.videoUrl = videoUrl; episodio.synopsis = synopsis;
    } else {
      temporada.episodes.push({ episode: capNum, title: capTitle, videoUrl, synopsis });
    }

    if (await guardarCatalogo(token, data, sha, `Cap ${capNum} en ${hubId}`)) {
      showStatus(`¡Éxito! Capítulo ${capNum} guardado.`, "success");
      document.getElementById('capTitle').value = '';
      document.getElementById('capVideoUrl').value = '';
      document.getElementById('capSynopsis').value = '';
      document.getElementById('capNum').value = capNum + 1;
    } else { showStatus("Error al guardar.", "error"); }
  }

  async function aplicarEdicion() {
    const token = document.getElementById('githubToken').value.trim();
    if (!token) { alert('Introduce tu token.'); return; }

    const id = document.getElementById('editHubId').value;
    if (!id) { alert('Selecciona un Hub primero.'); return; }

    let { data, sha } = await obtenerCatalogo(token);
    let hub = data.hubs.find(h => h.id === id);
    if (!hub) { alert('Hub no encontrado.'); return; }

    // Actualizar datos del Hub
    hub.title = document.getElementById('editHubTitle').value;
    hub.poster = document.getElementById('editHubPoster').value;
    hub.synopsis = document.getElementById('editHubSynopsis').value;

    // Si se llenó datos de capítulo para editar
    const capTitleEdit = document.getElementById('editCapTitle').value.trim();
    const videoEdit = document.getElementById('editCapVideo').value.trim();
    const seasonNumEdit = parseInt(document.getElementById('editSeasonNum').value);
    const capNumEdit = parseInt(document.getElementById('editCapNum').value);
    const seasonImgEdit = document.getElementById('editSeasonImage').value.trim();

    if (seasonNumEdit) {
      if (!hub.seasons) hub.seasons = [];
      let temp = hub.seasons.find(s => s.season === seasonNumEdit);
      if (!temp) {
        temp = { season: seasonNumEdit, image: seasonImgEdit, episodes: [] };
        hub.seasons.push(temp);
      } else if (seasonImgEdit) {
        temp.image = seasonImgEdit;
      }

      if (capTitleEdit || videoEdit) {
        let ep = temp.episodes.find(e => e.episode === capNumEdit);
        if (ep) {
          if (capTitleEdit) ep.title = capTitleEdit;
          if (videoEdit) ep.videoUrl = videoEdit;
        } else {
          temp.episodes.push({ episode: capNumEdit, title: capTitleEdit || "Sin título", videoUrl: videoEdit || "" });
        }
      }
    }

    if (await guardarCatalogo(token, data, sha, `Edición general de ${id}`)) {
      showStatus("¡Cambios aplicados y guardados con éxito!", "success");
      cargarDatosAdmin();
    } else {
      showStatus("Error al guardar cambios.", "error");
    }
  }

  async function procesarPublicidad() {
    const token = document.getElementById('githubToken').value.trim();
    if (!token) { alert('Introduce tu token.'); return; }
    
    const type = document.getElementById('pubType').value;
    const name = document.getElementById('pubName').value.trim();
    const image = document.getElementById('pubImage').value.trim();
    const link = document.getElementById('pubLink').value.trim();

    if (!name || !image) { alert('Nombre e imagen obligatorios.'); return; }

    let { data, sha } = await obtenerCatalogo(token);
    if (type === 'sponsor') {
      if (!data.sponsors) data.sponsors = [];
      data.sponsors.push({ name, image, link });
    } else {
      if (!data.banners) data.banners = [];
      data.banners.push({ name, image, link });
    }

    if (await guardarCatalogo(token, data, sha, `Registrar Patrocinador/Banner`)) {
      showStatus("¡Registrado con éxito!", "success");
      document.getElementById('pubName').value = '';
      document.getElementById('pubImage').value = '';
      document.getElementById('pubLink').value = '';
    } else { showStatus("Error al guardar.", "error"); }
  }

  async function procesarClan() {
    const token = document.getElementById('githubToken').value.trim();
    if (!token) { alert('Introduce tu token.'); return; }

    const title = document.getElementById('clanTitle').value.trim();
    const desc = document.getElementById('clanDesc').value.trim();
    const link = document.getElementById('clanLink').value.trim();

    let { data, sha } = await obtenerCatalogo(token);
    data.clan = { title, desc, link };

    if (await guardarCatalogo(token, data, sha, `Actualizar Clan CODM`)) {
      showStatus("¡Información del clan ॐiluminati actualizada con éxito!", "success");
    } else { showStatus("Error al guardar.", "error"); }
  }
</script>

</body>
</html>
