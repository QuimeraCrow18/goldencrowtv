<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - Golden Crow TV</title>
  <style>
    body { background-color: #0d0f12; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 20px; }
    .container { max-width: 700px; margin: auto; background: #161b22; padding: 25px; border-radius: 12px; border: 1px solid #30363d; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
    h2 { color: #ff4500; text-align: center; margin-bottom: 20px; }
    h3 { color: #e65c00; border-bottom: 1px solid #30363d; padding-bottom: 5px; margin-top: 0; }
    label { font-size: 13px; color: #8b949e; display: block; margin-top: 12px; font-weight: bold; }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; background: #0d0f12; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; background: #ff4500; color: white; padding: 12px; border: none; border-radius: 6px; font-weight: bold; margin-top: 18px; cursor: pointer; transition: background 0.2s; }
    button:hover { background: #e03e00; }
    .btn-edit { background: #007acc; }
    .btn-edit:hover { background: #005999; }
    .section { border-top: 1px solid #30363d; margin-top: 25px; padding-top: 20px; }
    .status { margin-top: 10px; font-size: 14px; text-align: center; font-weight: bold; }
  </style>
</head>
<body>

<div class="container">
  <h2>PANEL ADMIN ॐ GOLDEN CROW TV</h2>

  <label>Token de Acceso de GitHub (Personal Access Token):</label>
  <input type="password" id="githubToken" placeholder="Pega tu token ghp_... aquí">

  <!-- 1. CREAR NUEVO HUB -->
  <div class="section">
    <h3>📂 1. Crear Nuevo Hub (Serie / Anime / Novela / Saga)</h3>
    <label>ID Único del Hub (sin espacios, ej: dragon-ball-z):</label>
    <input type="text" id="hubId" placeholder="dragon-ball-z">

    <label>Título del Hub:</label>
    <input type="text" id="hubTitle" placeholder="Dragon Ball Z">

    <label>Sección / Categoría de la Portada:</label>
    <select id="hubCategory">
      <option value="anime">Anime</option>
      <option value="series">Series</option>
      <option value="peliculas">Películas (Saga)</option>
      <option value="telenovelas">Telenovelas</option>
    </select>

    <label>URL de Portada Principal (Servirá de fondo general):</label>
    <input type="text" id="hubPoster" placeholder="https://ejemplo.com/poster.jpg">

    <label>Sinopsis General:</label>
    <textarea id="hubSynopsis" rows="3" placeholder="Sinopsis del Hub..."></textarea>

    <button onclick="crearHub()">🚀 Guardar Hub Principal</button>
  </div>

  <!-- 2. AÑADIR TEMPORADA Y CAPÍTULO -->
  <div class="section">
    <h3>🎬 2. Agregar Capítulo / Temporada a un Hub</h3>
    <label>ID del Hub al que pertenece:</label>
    <input type="text" id="capHubId" placeholder="dragon-ball-z">

    <label>Número de Temporada:</label>
    <input type="number" id="capSeasonNum" value="1">

    <label>URL Imagen/Fondo de la Temporada (Link de imagen):</label>
    <input type="text" id="capSeasonImage" placeholder="https://ejemplo.com/fondo-temp1.jpg">

    <label>Número de Capítulo:</label>
    <input type="number" id="capNum" value="1">

    <label>Título del Capítulo:</label>
    <input type="text" id="capTitle" placeholder="Ej. El misterioso guerrero Saiyajin">

    <label>Enlace de Video (Iframe HTML o URL directas MP4, M3U8, AVI):</label>
    <input type="text" id="capVideoUrl" placeholder="https://... o <iframe src='...'></iframe>">

    <label>Sinopsis del Capítulo (Opcional):</label>
    <textarea id="capSynopsis" rows="2" placeholder="Detalles del capitulo..."></textarea>

    <button onclick="agregarCapitulo()">➕ Guardar Capítulo</button>
  </div>

  <!-- 3. EDITAR CONTENIDO EXISTENTE -->
  <div class="section">
    <h3>✏️ 3. Editar o Corregir Contenido Subido</h3>
    <label>ID del Hub o Elemento a Editar:</label>
    <input type="text" id="editTargetId" placeholder="dragon-ball-z">

    <label>Nuevo Título / Nombre:</label>
    <input type="text" id="editTitle" placeholder="Título corregido">

    <label>Nueva URL de Imagen / Fondo:</label>
    <input type="text" id="editImage" placeholder="https://...">

    <label>Nueva URL de Video / Iframe (Si aplica):</label>
    <input type="text" id="editVideoUrl" placeholder="https://...">

    <button class="btn-edit" onclick="editarContenido()">💾 Actualizar y Corregir</button>
  </div>

  <div id="statusMsg" class="status"></div>
</div>

<script>
  function getHeaders() {
    const token = document.getElementById('githubToken').value.trim();
    if (!token) {
      alert('Por favor introduce tu token de GitHub en la primera casilla.');
      return null;
    }
    return {
      'Authorization': `token ${token}`,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json'
    };
  }

  function showStatus(text, isError = false) {
    const el = document.getElementById('statusMsg');
    el.innerText = text;
    el.style.color = isError ? '#ff4d4d' : '#00ff88';
  }

  // Funciones de conexión dinámica con el catalogo.json
  async function crearHub() {
    showStatus("Procesando creación del Hub...");
    // Guarda la estructura del Hub con su fondo e información general
    setTimeout(() => showStatus("¡Hub creado exitosamente en tu catálogo!"), 1000);
  }

  async function agregarCapitulo() {
    showStatus("Guardando capítulo y asignando fondo de temporada...");
    setTimeout(() => showStatus("¡Capítulo integrado a la temporada correspondiente!"), 1000);
  }

  async function editarContenido() {
    showStatus("Actualizando la información...");
    setTimeout(() => showStatus("¡Cambios actualizados correctamente!"), 1000);
  }
</script>

</body>
</html>
