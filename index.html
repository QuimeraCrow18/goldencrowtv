<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Crow TV</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #080a0f;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .header { display: flex; flex-direction: column; margin-bottom: 20px; }
    .logo-title {
      font-size: 24px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px;
      color: #ffffff; border-bottom: 3px solid #e50914; padding-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .logo-title span { font-size: 11px; background: #e50914; padding: 3px 8px; border-radius: 4px; }
    .search-container {
      display: flex; align-items: center; background: rgba(18, 20, 32, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 25px; padding: 8px 16px; width: 100%; margin-top: 15px;
    }
    .search-input { background: transparent; border: none; outline: none; color: #ffffff; font-size: 14px; width: 100%; }
    .search-input::placeholder { color: #8c92a4; }
    .search-btn { background: transparent; border: none; cursor: pointer; font-size: 16px; color: #e50914; }
    
    .category-label {
      display: inline-block; background: #e50914; color: #ffffff; font-size: 12px;
      font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; margin: 20px 0 10px 0;
    }
    .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; }
    .media-card {
      background: #121420; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.1);
      text-decoration: none; color: #ffffff; display: block; transition: transform 0.2s, border-color 0.2s;
    }
    .media-card:hover { transform: scale(1.03); border-color: #00d2ff; }
    .media-card img { width: 100%; height: 160px; object-fit: cover; display: block; }
    .media-title { padding: 6px 4px; font-size: 11px; font-weight: bold; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .clan-section {
      background: linear-gradient(135deg, #121420, #1f1118); border: 1px solid #e50914;
      border-radius: 8px; padding: 15px; margin: 30px 0 20px 0; text-align: center;
    }
    .clan-title { font-size: 15px; font-weight: bold; color: #ffcc00; margin-bottom: 8px; }
    .clan-desc { font-size: 12px; color: #b3b3b3; margin-bottom: 12px; }
    .clan-btn-container { display: flex; justify-content: center; gap: 10px; }
    .clan-btn { background: #25d366; color: white; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; font-weight: bold; }
    .clan-btn.telegram { background: #0088cc; }

    .footer { margin-top: auto; text-align: center; padding: 20px 0 10px 0; font-size: 11px; color: #8c92a4; line-height: 1.5; }
    .triangle-seal { font-weight: bold; color: #ffcc00; letter-spacing: 1px; }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-title">
      Golden Crow TV
      <span>VOD Gratuito</span>
    </div>
    <div class="search-container">
      <input type="text" placeholder="Buscar películas, series, anime, novelas..." class="search-input" id="searchInput" onkeyup="filtrarContenido()" />
      <button class="search-btn" title="Buscar">🔍</button>
    </div>
  </div>

  <div id="contenedorCatalogo">
    <!-- El contenido se cargará dinámicamente desde catalogo.json -->
  </div>

  <!-- APARTADO RECLUTAMIENTO CLAN CALL OF DUTY -->
  <div class="clan-section">
    <div class="clan-title">⚔️ Clan ॐiluminati (CODM) ⚔️</div>
    <div class="clan-desc">Únete a nuestro clan activo. Reclutamiento abierto con el líder <strong id="clanLider">crow ✡︎</strong>.</div>
    <div class="clan-btn-container">
      <a href="#" id="btnTelegram" class="clan-btn telegram" target="_blank">Telegram Clan</a>
      <a href="#" id="btnWhatsapp" class="clan-btn" target="_blank">WhatsApp Clan</a>
    </div>
  </div>

  <!-- FOOTER CON SELLO EN TRIÁNGULO -->
  <div class="footer">
    <p>Conocimiento y entretenimiento libre para todos.</p>
    <p class="triangle-seal">
      ▲<br>
      Página patrocinada por ॐiluminati
    </p>
  </div>

  <script>
    let catalogoGlobal = [];

    async function cargarDatos() {
      try {
        let respuesta = await fetch('catalogo.json?' + new Date().getTime());
        let datos = await respuesta.json();
        
        // Cargar enlaces del clan
        if(datos.clan) {
          document.getElementById('btnWhatsapp').href = datos.clan.whatsapp || '#';
          document.getElementById('btnTelegram').href = datos.clan.telegram || '#';
          if(datos.clan.lider) document.getElementById('clanLider').innerText = datos.clan.lider;
        }

        catalogoGlobal = datos.contenido || [];
        mostrarCatalogo(catalogoGlobal);
      } catch (error) {
        console.error("Error al cargar el catálogo:", error);
      }
    }

    function mostrarCatalogo(items) {
      let contenedor = document.getElementById('contenedorCatalogo');
      contenedor.innerHTML = '';

      let categorias = ["Películas", "Series", "Anime", "Telenovelas"];

      categorias.forEach(cat => {
        let filtrados = items.filter(i => i.categoria === cat);
        if(filtrados.length > 0) {
          let label = document.createElement('div');
          label.className = 'category-label';
          label.innerText = cat;
          contenedor.appendChild(label);

          let grid = document.createElement('div');
          grid.className = 'media-grid';

          filtrados.forEach(item => {
            let card = document.createElement('a');
            card.className = 'media-card';
            card.href = "#"; // Aquí enlazaremos al reproductor o hub
            card.innerHTML = `
              <img src="${item.poster}" alt="${item.titulo}" />
              <div class="media-title">${item.titulo}</div>
            `;
            grid.appendChild(card);
          });
          contenedor.appendChild(grid);
        }
      });
    }

    function filtrarContenido() {
      let texto = document.getElementById('searchInput').value.toLowerCase();
      let filtrados = catalogoGlobal.filter(i => i.titulo.toLowerCase().includes(texto));
      mostrarCatalogo(filtrados);
    }

    cargarDatos();
  </script>
</body>
</html>
