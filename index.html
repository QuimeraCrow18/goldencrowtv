<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Crow TV</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #080a0f;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 15px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ENCABEZADO Y LOGO */
    .header {
      display: flex;
      flex-direction: column;
      margin-bottom: 20px;
    }
    .logo-title {
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: #ffffff;
      border-bottom: 3px solid #e50914;
      padding-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo-title span {
      font-size: 11px;
      background: #e50914;
      padding: 3px 8px;
      border-radius: 4px;
      letter-spacing: 0px;
    }

    /* BARRA DE BÚSQUEDA */
    .search-container {
      display: flex;
      align-items: center;
      background: rgba(18, 20, 32, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 25px;
      padding: 8px 16px;
      width: 100%;
      margin-top: 15px;
    }
    .search-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 14px;
      width: 100%;
    }
    .search-input::placeholder {
      color: #8c92a4;
    }
    .search-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 16px;
      color: #e50914;
    }

    /* ETIQUETAS DE CATEGORÍA */
    .category-label {
      display: inline-block;
      background: #e50914;
      color: #ffffff;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 4px;
      margin: 20px 0 10px 0;
    }

    /* FILAS / CUADRÍCULAS */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      gap: 12px;
    }
    .media-card {
      background: #121420;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      text-decoration: none;
      color: #ffffff;
      display: block;
      transition: transform 0.2s, border-color 0.2s;
    }
    .media-card:hover {
      transform: scale(1.03);
      border-color: #00d2ff;
    }
    .media-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
    }
    .media-title {
      padding: 6px 4px;
      font-size: 11px;
      font-weight: bold;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* SECCIÓN RECLUTAMIENTO CLAN CALL OF DUTY */
    .clan-section {
      background: linear-gradient(135deg, #121420, #1f1118);
      border: 1px solid #e50914;
      border-radius: 8px;
      padding: 15px;
      margin: 30px 0 20px 0;
      text-align: center;
    }
    .clan-title {
      font-size: 15px;
      font-weight: bold;
      color: #ffcc00;
      margin-bottom: 8px;
    }
    .clan-desc {
      font-size: 12px;
      color: #b3b3b3;
      margin-bottom: 12px;
    }
    .clan-btn-container {
      display: flex;
      justify-content: center;
      gap: 10px;
    }
    .clan-btn {
      background: #25d366;
      color: white;
      padding: 6px 12px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
      font-weight: bold;
    }
    .clan-btn.telegram {
      background: #0088cc;
    }

    /* FOOTER / SELLO EN TRIÁNGULO */
    .footer {
      margin-top: auto;
      text-align: center;
      padding: 20px 0 10px 0;
      font-size: 11px;
      color: #8c92a4;
      line-height: 1.5;
    }
    .triangle-seal {
      font-weight: bold;
      color: #ffcc00;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo-title">
      Golden Crow TV
      <span>VOD Gratuito</span>
    </div>
    
    <div class="search-container">
      <input type="text" placeholder="Buscar películas, series, anime, novelas..." class="search-input" id="searchInput" />
      <button class="search-btn" title="Buscar">🔍</button>
    </div>
  </div>

  <!-- PELÍCULAS -->
  <div class="category-label">Películas</div>
  <div class="media-grid">
    <a href="#" class="media-card">
      <img src="https://media.themoviedb.org/t/p/w130_and_h195_face/iUe4RD54SffgmRxGaQf26NZ04rJ.jpg" alt="2012" />
      <div class="media-title">2012</div>
    </a>
  </div>

  <!-- SERIES -->
  <div class="category-label">Series</div>
  <div class="media-grid">
    <a href="#" class="media-card">
      <img src="https://i.pinimg.com/736x/1d/34/40/1d3440b88ae169ae134643005e5215de.jpg" alt="Rick y Morty" />
      <div class="media-title">Rick y Morty</div>
    </a>
  </div>

  <!-- ANIME -->
  <div class="category-label">Anime</div>
  <div class="media-grid">
    <!-- Aquí irán los animes -->
  </div>

  <!-- NOVELAS -->
  <div class="category-label">Telenovelas</div>
  <div class="media-grid">
    <!-- Aquí irán las novelas -->
  </div>

  <!-- APARTADO RECLUTAMIENTO CLAN CALL OF DUTY -->
  <div class="clan-section">
    <div class="clan-title">⚔️ Clan ॐiluminati (CODM) ⚔️</div>
    <div class="clan-desc">Únete a nuestro clan activo. Reclutamiento abierto con el líder <strong>crow ✡︎</strong>.</div>
    <div class="clan-btn-container">
      <a href="#" class="clan-btn telegram">Telegram Clan</a>
      <a href="#" class="clan-btn">WhatsApp Clan</a>
    </div>
  </div>

  <!-- FOOTER CON SELLO EN TRIÁNGULO -->
  <div class="footer">
    <p>Conocimiento y entretenimiento libre para todos.</p>
    <p class="triangle-seal">
      ▲<br>
      Página patrocinada por ॐiluminati
    </p>
  </div>

</body>
</html>
