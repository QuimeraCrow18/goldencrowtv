<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Golden Crow TV</title>
  <style>
    body { background-color: #0d0f12; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    header { background: #161b22; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
    h1 { color: #ff4500; margin: 0; font-size: 24px; }
    .container { padding: 20px 30px; }
    .section-title { font-size: 20px; color: #e65c00; margin-top: 30px; border-bottom: 2px solid #30363d; padding-bottom: 5px; text-transform: uppercase; }
    .grid { display: flex; gap: 15px; overflow-x: auto; padding: 15px 0; scroll-behavior: smooth; }
    .grid::-webkit-scrollbar { height: 8px; }
    .grid::-webkit-scrollbar-thumb { background: #ff4500; border-radius: 4px; }
    .card { min-width: 140px; width: 140px; background: #161b22; border-radius: 8px; overflow: hidden; border: 1px solid #30363d; cursor: pointer; transition: transform 0.2s; }
    .card:hover { transform: scale(1.05); border-color: #ff4500; }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .card-title { padding: 8px; font-size: 13px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    /* Cuadro de Honor y Clan */
    .extra-section { margin-top: 40px; background: #161b22; padding: 20px; border-radius: 8px; border: 1px solid #30363d; }
    .sponsors-grid { display: flex; gap: 15px; flex-wrap: wrap; margin-top: 10px; }
    .sponsor-item { background: #0d0f12; padding: 10px; border-radius: 6px; border: 1px solid #d4af37; text-align: center; width: 120px; }
    .sponsor-item img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
    .clan-box { background: linear-gradient(135deg, #1f1a24, #120d18); border: 1px solid #8a2be2; padding: 15px; border-radius: 8px; margin-top: 30px; }
    .btn-clan { display: inline-block; background: #8a2be2; color: white; padding: 8px 15px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 10px; }
    .btn-clan:hover { background: #7b1fa2; }
  </style>
</head>
<body>

<header>
  <h1>ॐ GOLDEN CROW TV</h1>
  <div>
    <a href="admin.html" style="color: #8b949e; text-decoration: none; font-size: 14px; font-weight: bold;">⚙️ Admin Panel</a>
  </div>
</header>

<div class="container" id="mainContainer">
  <p style="text-align: center; color: #8b949e;">Cargando catálogo desde GitHub...</p>
</div>

<script>
  const REPO_OWNER = "quimeracrow18";
  const REPO_NAME = "goldencrowtv";
  const FILE_PATH = "catalogo.json";

  async function cargarCatalogoPublico() {
    try {
      let res = await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}?t=${Date.now()}`);
      if (!res.ok) throw new Error("No se pudo cargar el catálogo");
      let data = await res.json();
      
      // Normalizar estructura si viene antigua
      let hubs = data.hubs || (Array.isArray(data) ? data : []);
      let sponsors = data.sponsors || [];
      let banners = data.banners || [];
      let clan = data.clan || {};

      renderizarSitio(hubs, sponsors, banners, clan);
    } catch (e) {
      document.getElementById('mainContainer').innerHTML = `<p style="text-align: center; color: #ff4d4d;">Error al cargar el contenido. Asegúrate de haber publicado al menos un Hub desde el panel admin.</p>`;
    }
  }

  function renderizarSitio(hubs, sponsors, banners, clan) {
    const container = document.getElementById('mainContainer');
    container.innerHTML = '';

    // Agrupar por categorías
    const categorias = {
      'series': '📺 Series',
      'anime': '⚡ Anime',
      'peliculas': '🎬 Películas',
      'telenovelas': '💖 Telenovelas'
    };

    for (let catKey in categorias) {
      let hubsCat = hubs.filter(h => h.category === catKey);
      if (hubsCat.length > 0) {
        let titleDiv = document.createElement('div');
        titleDiv.className = 'section-title';
        titleDiv.innerText = categorias[catKey];
        container.appendChild(titleDiv);

        let grid = document.createElement('div');
        grid.className = 'grid';

        hubsCat.forEach(hub => {
          let card = document.createElement('div');
          card.className = 'card';
          card.onclick = () => {
            // Aquí puedes redirigir a la vista del hub o temporada pasando el ID
            alert(`Abriendo Hub: ${hub.title}`);
          };
          card.innerHTML = `
            <img src="${hub.poster || 'https://via.placeholder.com/140x200'}" alt="${hub.title}">
            <div class="card-title">${hub.title}</div>
          `;
          grid.appendChild(card);
        });
        container.appendChild(grid);
      }
    }

    // Cuadro de Honor (Patrocinadores)
    if (sponsors.length > 0) {
      let spSection = document.createElement('div');
      spSection.className = 'extra-section';
      spSection.innerHTML = `<h3>⭐ Cuadro de Honor (Patrocinadores)</h3>`;
      let spGrid = document.createElement('div');
      spGrid.className = 'sponsors-grid';
      sponsors.forEach(s => {
        let item = document.createElement('div');
        item.className = 'sponsor-item';
        item.innerHTML = `
          <img src="${s.image}" alt="${s.name}">
          <div style="font-size: 11px; margin-top: 5px; font-weight: bold;">${s.name}</div>
        `;
        spGrid.appendChild(item);
      });
      spSection.appendChild(spGrid);
      container.appendChild(spSection);
    }

    // Sección Clan CODM
    if (clan && clan.title) {
      let clanDiv = document.createElement('div');
      clanDiv.className = 'clan-box';
      clanDiv.innerHTML = `
        <h3 style="color: #b19cd9; margin-top: 0;">🛡️ ${clan.title}</h3>
        <p style="font-size: 13px; color: #c9d1d9; margin: 5px 0;">${clan.desc}</p>
        ${clan.link ? `<a href="${clan.link}" target="_blank" class="btn-clan">Unirse al Clan ॐiluminati</a>` : ''}
      `;
      container.appendChild(clanDiv);
    }
  }

  cargarCatalogoPublico();
</script>

</body>
</html>
