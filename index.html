<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ॐ GOLDEN CROW TV - Streaming</title>
  <style>
    body { background-color: #0d0f12; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    header { background: #161b22; padding: 15px 20px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; gap: 15px; position: sticky; top: 0; z-index: 1000; }
    h1 { color: #ff4500; margin: 0; font-size: 20px; cursor: pointer; }
    nav { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
    nav a { color: #c9d1d9; text-decoration: none; font-size: 13px; font-weight: bold; transition: color 0.2s; }
    nav a:hover { color: #ff4500; }

    /* Barra de Búsqueda estilo Cuevana */
    .search-box { display: flex; align-items: center; background: #0d0f12; border: 1px solid #30363d; border-radius: 20px; padding: 5px 15px; width: 260px; transition: border-color 0.2s; }
    .search-box:focus-within { border-color: #ff4500; }
    .search-box input { background: transparent; border: none; color: #fff; outline: none; width: 100%; font-size: 13px; }
    .search-box span { color: #8b949e; font-size: 16px; cursor: pointer; }

    .container { max-width: 1200px; margin: 20px auto; padding: 0 15px; }
    .section-title { color: #ff4500; border-bottom: 2px solid #30363d; padding-bottom: 8px; margin-top: 35px; font-size: 20px; text-transform: uppercase; letter-spacing: 1px; }

    /* Parrilla de Contenido */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; overflow: hidden; cursor: pointer; transition: transform 0.2s, border-color 0.2s; text-decoration: none; color: inherit; display: flex; flex-direction: column; }
    .card:hover { transform: scale(1.03); border-color: #ff4500; }
    .card img { width: 100%; height: 210px; object-fit: cover; }
    .card-body { padding: 10px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 13px; font-weight: bold; color: #f0f6fc; margin: 0 0 5px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-cat { font-size: 11px; color: #8b949e; text-transform: uppercase; }

    .loading { text-align: center; color: #8b949e; padding: 50px; font-size: 16px; }
  </style>
</head>
<body>

<header>
  <h1 onclick="window.location.reload()">ॐ GOLDEN CROW TV</h1>
  
  <!-- Buscador Estilo Cuevana -->
  <div class="search-box">
    <input type="text" id="searchInput" placeholder="Buscar películas y series..." oninput="filtrarCatalogo()">
    <span>🔍</span>
  </div>

  <nav>
    <a href="index.html">Inicio</a>
    <a href="#peliculas">Películas</a>
    <a href="#series">Series</a>
    <a href="#anime">Anime</a>
    <a href="#telenovelas">Telenovelas</a>
    <a href="clan.html">Únete al Clan</a>
  </nav>
</header>

<div class="container" id="mainContainer">
  <div class="loading">Cargando cartelera...</div>
</div>

<script>
  let todosLosHubs = [];

  async function cargarInicio() {
    const container = document.getElementById('mainContainer');
    try {
      const res = await fetch('catalogo.json?t=' + Date.now());
      if (!res.ok) throw new Error('No se pudo cargar el catálogo.');
      const data = await res.json();
      todosLosHubs = data.hubs || data;

      if (!todosLosHubs || todosLosHubs.length === 0) {
        container.innerHTML = '<div class="loading">Aún no hay contenido publicado en el catálogo.</div>';
        return;
      }

      renderizarCategorias(todosLosHubs);

    } catch (e) {
      container.innerHTML = '<div class="loading" style="color:#ff4d4d;">Error al conectar con el catálogo en GitHub.</div>';
    }
  }

  function renderizarCategorias(hubs) {
    const container = document.getElementById('mainContainer');
    const categorias = ['peliculas', 'series', 'anime', 'telenovelas'];
    const nombresCat = { peliculas: 'Películas', series: 'Series', anime: 'Anime', telenovelas: 'Telenovelas' };

    let html = '';

    categorias.forEach(cat => {
      const items = hubs.filter(h => (h.category || '').toLowerCase() === cat);
      if (items.length > 0) {
        html += `<div id="${cat}" class="section-title">${nombresCat[cat]}</div>`;
        html += `<div class="grid">`;
        items.forEach(h => {
          html += `
            <a href="hub.html?id=${h.id}" class="card" loading="lazy">
              <img src="${h.poster || 'https://via.placeholder.com/150x210'}" alt="${h.title}">
              <div class="card-body">
                <h3 class="card-title">${h.title}</h3>
                <span class="card-cat">${nombresCat[cat]}</span>
              </div>
            </a>
          `;
        });
        html += `</div>`;
      }
    });

    if (html === '') {
      html = '<div class="loading">No se encontraron resultados con ese criterio.</div>';
    }

    container.innerHTML = html;
  }

  function filtrarCatalogo() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    if (!query) {
      renderizarCategorias(todosLosHubs);
      return;
    }

    const filtrados = todosLosHubs.filter(h => h.title.toLowerCase().includes(query));
    const container = document.getElementById('mainContainer');

    let html = `<div class="section-title">Resultados de búsqueda ("${query}")</div>`;
    if (filtrados.length > 0) {
      html += `<div class="grid">`;
      filtrados.forEach(h => {
        html += `
          <a href="hub.html?id=${h.id}" class="card">
            <img src="${h.poster || 'https://via.placeholder.com/150x210'}" alt="${h.title}">
            <div class="card-body">
              <h3 class="card-title">${h.title}</h3>
              <span class="card-cat">${h.category || 'General'}</span>
            </div>
          </a>
        `;
      });
      html += `</div>`;
    } else {
      html = `<div class="loading">No se encontró ninguna película o serie con ese nombre.</div>`;
    }

    container.innerHTML = html;
  }

  cargarInicio();
</script>

</body>
</html>
