<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor - ॐ GOLDEN CROW TV</title>
  <style>
    body { background-color: #0d0f12; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    header { background: #161b22; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
    h1 { color: #ff4500; margin: 0; font-size: 20px; cursor: pointer; }
    .player-container { max-width: 960px; margin: 30px auto; padding: 0 15px; text-align: center; }
    .video-wrapper { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; background: #000; border-radius: 10px; border: 1px solid #30363d; box-shadow: 0 4px 20px rgba(0,0,0,0.8); }
    .video-wrapper iframe, .video-wrapper video, .video-wrapper object, .video-wrapper embed { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .info-box { background: #161b22; padding: 20px; border-radius: 10px; margin-top: 20px; border: 1px solid #30363d; text-align: left; }
    .info-box h2 { color: #ff4500; margin-top: 0; font-size: 22px; }
    .btn-back { display: inline-block; background: #30363d; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 15px; transition: 0.2s; }
    .btn-back:hover { background: #484f58; }
  </style>
</head>
<body>

<header>
  <h1 onclick="window.location.href='index.html'">ॐ GOLDEN CROW TV</h1>
  <a href="index.html" style="color: #c9d1d9; text-decoration: none; font-size: 14px; font-weight: bold;">Volver al Inicio</a>
</header>

<div class="player-container">
  <div id="playerWrapper" class="video-wrapper">
    <p style="padding-top: 20%; color: #8b949e;">Cargando reproductor...</p>
  </div>
  
  <div class="info-box" id="infoBox">
    <h2>Cargando información...</h2>
  </div>
</div>

<script>
  async function reproducirContenido() {
    const params = new URLSearchParams(window.location.search);
    const hubId = params.get('id');
    const seasonNum = parseInt(params.get('s')) || 1;
    const epNum = parseInt(params.get('e')) || 1;

    const wrapper = document.getElementById('playerWrapper');
    const infoBox = document.getElementById('infoBox');

    try {
      const res = await fetch('catalogo.json?t=' + Date.now());
      const data = await res.json();
      const hubs = data.hubs || data;
      const hub = hubs.find(h => h.id === hubId);

      if (!hub) {
        wrapper.innerHTML = '<p style="padding-top: 20%; color: #ff4d4d;">Contenido no encontrado.</p>';
        return;
      }

      let temporada = hub.seasons.find(s => s.season === seasonNum);
      if (!temporada) temporada = hub.seasons[0];

      let episodio = temporada.episodes.find(e => (e.episode === epNum || e.num === epNum));
      if (!episodio) episodio = temporada.episodes[0];

      if (!episodio || !episodio.videoUrl) {
        wrapper.innerHTML = '<p style="padding-top: 20%; color: #ff4d4d;">No hay enlace de video disponible para este contenido.</p>';
        return;
      }

      // Inyectar video o iframe universal
      if (episodio.videoUrl.trim().startsWith('<iframe')) {
        wrapper.innerHTML = episodio.videoUrl;
      } else {
        wrapper.innerHTML = `<iframe src="${episodio.videoUrl}" allowfullscreen></iframe>`;
      }

      // Inyectar información y botones de descarga si los tiene
      let botonDescarga = episodio.downloadUrl ? `<a href="${episodio.downloadUrl}" target="_blank" style="background: #238636; color: #fff; padding: 10px 20px; text-decoration: none; border-radius: 6px; font-weight: bold; display: inline-block; margin-top: 15px; margin-left: 10px;">📥 Descargar (TeraBox)</a>` : '';

      infoBox.innerHTML = `
        <h2>${hub.title} - T${seasonNum} : E${epNum} ${episodio.title ? '- ' + episodio.title : ''}</h2>
        <p>${episodio.synopsis || hub.synopsis || 'Disfruta de este contenido en alta calidad sin anuncios molestos.'}</p>
        <div style="margin-top: 15px;">
          <a href="hub.html?id=${hub.id}" class="btn-back">⬅ Volver al Menú del Título</a>
          ${botonDescarga}
        </div>
      `;

    } catch (e) {
      wrapper.innerHTML = '<p style="padding-top: 20%; color: #ff4d4d;">Error al cargar el reproductor.</p>';
    }
  }

  reproducirContenido();
</script>

</body>
</html>
