<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reproductor - Golden Crow TV</title>
  <style>
    body { background-color: #0d0f12; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
    header { background: #161b22; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; }
    h1 { color: #ff4500; margin: 0; font-size: 22px; cursor: pointer; }
    .container { max-width: 900px; margin: auto; padding: 20px; }
    
    .player-box { background: #000; border-radius: 10px; overflow: hidden; border: 1px solid #30363d; box-shadow: 0 4px 20px rgba(0,0,0,0.8); position: relative; width: 100%; min-height: 400px; display: flex; justify-content: center; align-items: center; }
    .player-box iframe, .player-box video { width: 100%; height: 500px; border: none; }
    
    .details-box { background: #161b22; margin-top: 20px; padding: 20px; border-radius: 10px; border: 1px solid #30363d; background-size: cover; background-position: center; position: relative; }
    .details-overlay { background: rgba(22, 27, 34, 0.88); padding: 15px; border-radius: 8px; }
    
    .ep-title { color: #ff4500; font-size: 22px; margin-top: 0; margin-bottom: 8px; }
    .ep-meta { font-size: 13px; color: #8b949e; margin-bottom: 12px; }
    .ep-synopsis { font-size: 14px; color: #c9d1d9; line-height: 1.5; }
    
    .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; }
    .btn { background: #30363d; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 6px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; transition: background 0.2s; }
    .btn:hover { background: #ff4500; }
    
    .sponsor-footer { margin-top: 30px; text-align: center; color: #8b949e; font-size: 12px; border-top: 1px solid #30363d; padding-top: 15px; }
    .sponsor-footer span { color: #d4af37; font-weight: bold; }
  </style>
</head>
<body>

<header>
  <h1 onclick="window.location.href='index.html'">ॐ GOLDEN CROW TV</h1>
  <div>
    <button class="btn" id="btnVolverHub">← Volver al Hub</button>
  </div>
</header>

<div class="container" id="playerContainer">
  <p style="text-align: center; color: #8b949e;">Cargando reproductor...</p>
</div>

<script>
  const REPO_OWNER = "quimeracrow18";
  const REPO_NAME = "goldencrowtv";
  const FILE_PATH = "catalogo.json";

  const urlParams = new URLSearchParams(window.location.search);
  const hubId = urlParams.get('id');
  const seasonNum = parseInt(urlParams.get('s'));
  const epNum = parseInt(urlParams.get('e'));

  async function cargarReproductor() {
    if (!hubId || isNaN(seasonNum) || isNaN(epNum)) {
      document.getElementById('playerContainer').innerHTML = `<p style="text-align: center; color: #ff4d4d;">Faltan parámetros de video en la URL.</p>`;
      return;
    }

    // Configurar botón de regreso
    document.getElementById('btnVolverHub').onclick = () => {
      window.location.href = `hub.html?id=${hubId}`;
    };

    try {
      let res = await fetch(`https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/main/${FILE_PATH}?t=${Date.now()}`);
      if (!res.ok) throw new Error("No se pudo conectar al catálogo");
      let data = await res.json();

      let hubs = data.hubs || (Array.isArray(data) ? data : []);
      let hub = hubs.find(h => h.id === hubId);

      if (!hub) {
        document.getElementById('playerContainer').innerHTML = `<p style="text-align: center; color: #ff4d4d;">Contenido no encontrado.</p>`;
        return;
      }

      let temporada = hub.seasons ? hub.seasons.find(s => s.season === seasonNum) : null;
      let episodio = temporada ? temporada.episodes.find(e => e.episode === epNum) : null;

      if (!episodio) {
        document.getElementById('playerContainer').innerHTML = `<p style="text-align: center; color: #ff4d4d;">El episodio solicitado no está disponible.</p>`;
        return;
      }

      renderizarReproductor(hub, temporada, episodio);
    } catch (e) {
      document.getElementById('playerContainer').innerHTML = `<p style="text-align: center; color: #ff4d4d;">Error al cargar el video.</p>`;
    }
  }

  function renderizarReproductor(hub, temporada, episodio) {
    const container = document.getElementById('playerContainer');

    // Procesar el enlace/iframe
    let videoMarkup = '';
    let url = episodio.videoUrl.trim();

    if (url.startsWith('<iframe')) {
      videoMarkup = url;
    } else if (url.endsWith('.mp4') || url.endsWith('.m3u8') || url.endsWith('.webm')) {
      videoMarkup = `<video controls autoplay><source src="${url}" type="video/mp4">Tu navegador no soporta el reproductor.</video>`;
    } else {
      videoMarkup = `<iframe src="${url}" allowfullscreen allowtransparency allow="autoplay" scrolling="no" frameborder="0"></iframe>`;
    }

    const bgImage = (temporada && temporada.image) ? temporada.image : (hub.poster || '');

    container.innerHTML = `
      <div class="player-box">
        ${videoMarkup}
      </div>

      <div class="details-box" style="background-image: url('${bgImage}');">
        <div class="details-overlay">
          <h2 class="ep-title">${episodio.title || `Capítulo ${episodio.episode}`}</h2>
          <div class="ep-meta">${hub.title} • Temporada ${temporada.season} • Episodio ${episodio.episode}</div>
          <p class="ep-synopsis">${episodio.synopsis || 'Sin descripción disponible para este episodio.'}</p>
        </div>
      </div>

      <div class="nav-buttons">
        <button class="btn" onclick="window.location.href='hub.html?id=${hub.id}'">📂 Ver todos los capítulos</button>
        <button class="btn" onclick="window.location.href='index.html'">🏠 Inicio</button>
      </div>

      <div class="sponsor-footer">
        Conocimiento y entretenimiento libre para todos. <br>
        Página patrocinada por <span>ॐiluminati</span>
      </div>
    `;
  }

  cargarReproductor();
</script>

</body>
</html>
